[package]
name = "tachyon"
version = "0.1.0"
edition = "2021"
description = "A cell-simulation engine for ASCII games rendered in the terminal"

[dependencies]
# The only dependency: raw terminal mode, input events and resize, on Windows, Linux and macOS.
crossterm = "0.28"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Debug builds stay playable: our code at -O1, dependencies fully optimised.
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

# Games built on the engine live in games/ and share its build.
[workspace]
members = [".", "games/broadside"]
