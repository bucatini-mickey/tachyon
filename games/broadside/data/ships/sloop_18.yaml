# Stat block for an 18-gun sloop-of-war - a small, handy unrated vessel,
# typically a lieutenant's or junior commander's first independent command.
# The default ship used by the Phase 0 skeleton.
#
# Figures are representative of a Royal Navy sloop-of-war of the
# Napoleonic period (broadly comparable to the Cruizer class, one of the
# most numerous warship classes ever built) - see
# docs/design/06_research_references.md for how to source and refine
# figures like these as later phases need more precision.

name: "18-Gun Sloop"
ship_class: sloop_18
rate: "Unrated (Sloop-of-war)"

length_m: 30.2
beam_m: 9.1
draught_m: 3.7
tonnage_bm: 385
max_crew: 121

guns:
  - type: "32-pounder carronade"
    count: 16
    deck: "main deck"
  - type: "6-pounder long gun"
    count: 2
    deck: "main deck"

sail_plan: "ship-rigged sloop (fore, main, and mizzen masts, square-rigged on fore and main)"

# Tile dimensions of the local deck grid used for the crew/rendering skeleton.
# Later phases will likely want separate grids per deck level rather than
# one flat grid - noted here, not yet implemented.
deck_grid:
  width: 18
  height: 7

notes: >
  Representative of a Royal Navy Cruizer-class brig-sloop, one of the most
  numerous warship classes of the Napoleonic Wars (over 100 built). A
  common first command for a newly-made commander - a fitting starting
  vessel for the campaign's promotion-on-death succession arc.
